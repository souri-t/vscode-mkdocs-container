services:
  app:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    working_dir: /workspace/sample/ExternalDesignDocument
    volumes:
      - ./workspace:/workspace:cached
      - ./mkdocs-hooks:/mkdocs-hooks:ro
    command: mkdocs serve -a 0.0.0.0:8000
    ports:
      - "38000:8000"
    depends_on:
      - plantuml
      - kroki
    networks:
      - mkdocs-net

  plantuml:
    image: plantuml/plantuml-server:jetty
    expose:
      - "8080"
    networks:
      - mkdocs-net

  kroki:
    image: yuzutech/kroki
    depends_on:
      - mermaid
    environment:
      KROKI_MERMAID_HOST: mermaid
    expose:
      - "8000"
    networks:
      - mkdocs-net

  mermaid:
    image: yuzutech/kroki-mermaid
    expose:
      - "8002"
    networks:
      - mkdocs-net

networks:
  mkdocs-net:
    driver: bridge
